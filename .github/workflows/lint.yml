name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Install pnpm
              uses: pnpm/action-setup@v6
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
